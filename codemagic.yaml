workflows:
  # Tag push → TestFlight (Spotify + Sentry enabled for testers)
  ios-release:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      vars:
        AUDIO_SESSION_MICROPHONE: "0"
        # The build needs only Flutter from mise.toml.
        MISE_DISABLE_TOOLS: gh,biome,java
      groups:
        - app-store-credentials
        - app-env
    integrations:
      app_store_connect: Lauschi
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up code signing
        script: |
          # Stop here when App Store Connect refuses (e.g. an expired
          # agreement), instead of failing much later in the build with a
          # misleading "no development certificates" error.
          set -e
          app-store-connect fetch-signing-files "app.lauschi.lauschi" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Write .env.app file
        script: |
          cat <<EOF > $CM_BUILD_DIR/.env.app
          ENABLE_SPOTIFY=true
          SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID
          ENABLE_APPLE_MUSIC=true
          ENABLE_SENTRY=true
          SENTRY_DSN=$SENTRY_DSN
          SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT
          EOF

      # Flutter at the version mise.toml pins, the same as the GitHub
      # builds. Codemagic's own Flutter is not used.
      - name: Install Flutter with mise
        script: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.10.3 sh
          export PATH="$HOME/.local/bin:$PATH"
          mise trust "$CM_BUILD_DIR/mise.toml"
          mise install --locked
          echo "PATH=$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH" >> "$CM_ENV"

      - name: Install dependencies
        script: flutter pub get

      - name: Run code generation
        script: mise run codegen

      - name: Build iOS
        script: |
          VERSION_NAME=$(echo "$CM_TAG" | sed 's/^v//')
          flutter build ipa --release \
            --build-name="$VERSION_NAME" \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define-from-file=$CM_BUILD_DIR/.env.app \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true

  # Triggered via Codemagic API from .github/workflows/ios-store.yml
  # when a GitHub Release is published. Builds with Spotify + Sentry
  # disabled for public App Store submission.
  ios-store:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      vars:
        AUDIO_SESSION_MICROPHONE: "0"
        # The build needs only Flutter from mise.toml.
        MISE_DISABLE_TOOLS: gh,biome,java
      groups:
        - app-store-credentials
    integrations:
      app_store_connect: Lauschi
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Set up code signing
        script: |
          # Stop here when App Store Connect refuses (e.g. an expired
          # agreement), instead of failing much later in the build with a
          # misleading "no development certificates" error.
          set -e
          app-store-connect fetch-signing-files "app.lauschi.lauschi" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Write .env.app file
        script: |
          cat <<EOF > $CM_BUILD_DIR/.env.app
          ENABLE_SPOTIFY=false
          SPOTIFY_CLIENT_ID=unused
          ENABLE_APPLE_MUSIC=true
          ENABLE_SENTRY=false
          SENTRY_DSN=unused
          SENTRY_ENVIRONMENT=production
          EOF

      # Flutter at the version mise.toml pins, the same as the GitHub
      # builds. Codemagic's own Flutter is not used.
      - name: Install Flutter with mise
        script: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.10.3 sh
          export PATH="$HOME/.local/bin:$PATH"
          mise trust "$CM_BUILD_DIR/mise.toml"
          mise install --locked
          echo "PATH=$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH" >> "$CM_ENV"

      # Store builds ship without the Sentry SDK, not just with it off.
      - name: Remove Sentry
        script: tool/strip_sentry.sh

      - name: Install dependencies
        script: flutter pub get

      - name: Run code generation
        script: mise run codegen

      - name: Build iOS
        script: |
          VERSION_NAME=$(echo "$CM_TAG" | sed 's/^v//')
          flutter build ipa --release \
            --build-name="$VERSION_NAME" \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define-from-file=$CM_BUILD_DIR/.env.app \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Check the IPA has no Sentry
        script: tool/check_no_sentry.sh build/ios/ipa/*.ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
