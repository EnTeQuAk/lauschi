name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Analyze · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Read Flutter version from mise.toml
        id: flutter-version
        run: echo "version=$(grep -m1 '^flutter =' mise.toml | sed 's/.*= *"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (Riverpod + Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Create .env.app for tests
        run: |
          cat > .env.app << EOF
          ENABLE_SPOTIFY=false
          SPOTIFY_CLIENT_ID=
          ENABLE_APPLE_MUSIC=true
          ENABLE_SENTRY=false
          SENTRY_DSN=
          SENTRY_ENVIRONMENT=ci
          EOF

      - name: Run tests
        run: flutter test --dart-define-from-file=.env.app

      - name: Build APK (verify compilation)
        if: github.event_name == 'pull_request'
        env:
          # Read by gradle: injected into AndroidManifest for on-device JWT.
          APPLE_MUSIC_KEY: ${{ secrets.APPLE_MUSIC_KEY }}
        run: flutter build apk --debug --dart-define-from-file=.env.app

  tools:
    name: Catalog tools · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools

    steps:
      - uses: actions/checkout@v7

      # The tests read the committed curations, which live in LFS. Only those
      # are pulled, and the LFS store is cached, so a push downloads just the
      # curations it changed instead of the whole set.
      - name: List curation LFS objects
        working-directory: .
        run: git lfs ls-files -l --include "assets/catalog/curation/*" | cut -d' ' -f1 | sort > lfs-curation-ids

      - uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-curation-${{ hashFiles('lfs-curation-ids') }}
          restore-keys: lfs-curation-

      - name: Pull curations
        working-directory: .
        run: git lfs pull --include "assets/catalog/curation/*"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      # The same checks as `mise run tools-check`.
      - name: Install dependencies
        run: uv sync --locked --extra ai --extra web

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests

      - name: Run tests
        run: uv run --no-sync pytest
