name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Analyze · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The job needs only Flutter and Java from mise.toml.
      MISE_DISABLE_TOOLS: gh,biome

    steps:
      - uses: actions/checkout@v7

      # The app bundles the branding images, which live in LFS.
      - run: git lfs pull --include "assets/images/branding/*"

      # Flutter and Java at the versions mise.toml pins, so CI runs the
      # same toolchain and tasks as a local `mise run check`. The cache is
      # saved after the job so it holds the SDK artifacts Flutter
      # downloads on first use.
      - uses: jdx/mise-action@v5.1.1
        with:
          cache_save_post: true

      # .dart_tool/ holds build_runner's compiled builders, which are tied
      # to the Flutter SDK, so a toolchain change in mise.toml starts over.
      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock', 'mise.toml') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (Riverpod + Drift)
        run: mise run codegen

      - name: Format and analyze
        run: mise run lint

      - name: Create .env.app for tests
        run: |
          cat > .env.app << EOF
          ENABLE_SPOTIFY=false
          SPOTIFY_CLIENT_ID=
          ENABLE_APPLE_MUSIC=true
          ENABLE_SENTRY=false
          SENTRY_DSN=
          SENTRY_ENVIRONMENT=ci
          EOF

      - name: Run tests
        run: mise run test

      - name: Build APK (verify compilation)
        if: github.event_name == 'pull_request'
        env:
          # Read by gradle: injected into AndroidManifest for on-device JWT.
          APPLE_MUSIC_KEY: ${{ secrets.APPLE_MUSIC_KEY }}
        run: flutter build apk --debug --dart-define-from-file=.env.app

  store-variant:
    name: Store build without Sentry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_DISABLE_TOOLS: gh,biome

    # The store builds run tool/strip_sentry.sh only on a release. This
    # keeps the stripped app compiling in between, so a Sentry call outside
    # lib/core/telemetry/ fails here and not on release day.
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.1.1

      # Restore only: the stripped .dart_tool/ must not land in the cache
      # the check job uses.
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock', 'mise.toml') }}

      - name: Remove Sentry
        run: tool/strip_sentry.sh

      - name: Code generation (Riverpod + Drift)
        run: mise run codegen

      - name: Analyze
        run: flutter analyze --fatal-infos

  tools:
    name: Catalog tools · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools

    steps:
      - uses: actions/checkout@v7

      # The tests read the committed curations, which live in LFS.
      - run: git lfs pull --include "assets/catalog/curation/*"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      # The same checks as `mise run tools-check`.
      - name: Install dependencies
        run: uv sync --locked --extra ai --extra web

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests

      - name: Run tests
        run: uv run --no-sync pytest
