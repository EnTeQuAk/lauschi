name: Pull LFS files
description: >-
  Pull only the LFS files a job needs, with the LFS store cached between
  runs, so a push downloads just the files it changed.

inputs:
  include:
    description: The files to pull, as a `git lfs --include` pattern.
    required: true
  cache-name:
    description: Names this set's cache, one per pattern.
    required: true

runs:
  using: composite
  steps:
    - name: List LFS objects
      shell: bash
      env:
        INCLUDE: ${{ inputs.include }}
        IDS: lfs-${{ inputs.cache-name }}-ids
      run: git lfs ls-files -l --include "$INCLUDE" | cut -d' ' -f1 | sort > "$IDS"

    - uses: actions/cache@v5
      with:
        path: .git/lfs
        key: lfs-${{ inputs.cache-name }}-${{ hashFiles(format('lfs-{0}-ids', inputs.cache-name)) }}
        restore-keys: lfs-${{ inputs.cache-name }}-

    - name: Pull LFS files
      shell: bash
      env:
        INCLUDE: ${{ inputs.include }}
      run: git lfs pull --include "$INCLUDE"
