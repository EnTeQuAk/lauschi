version = 1
agents = ["claude"]

[[skills]]
name = "dotagents"
source = "getsentry/dotagents"

[[skills]]
name = "update-changelog"
source = "path:.agents/skills/update-changelog"

[[skills]]
name = "release"
source = "path:.agents/skills/release"

[[skills]]
name = "code-simplifier"
source = "path:.agents/skills/code-simplifier"

[[skills]]
name = "impeccable"
source = "pbakaus/impeccable"

[[skills]]
name = "prompt-optimizer"
source = "getsentry/skills"

[[skills]]
name = "dart-run-static-analysis"
source = "dart-lang/skills"

[[skills]]
name = "dart-resolve-package-conflicts"
source = "dart-lang/skills"

[[skills]]
name = "dart-use-pattern-matching"
source = "dart-lang/skills"

[[plugins]]
name = "sentry"
source = "getsentry/agent-plugin"
path = "."

# pydantic/skills is a plugin marketplace, so `add` would install whole
# plugins. These are the three skills the catalog tooling needs, taken
# straight from the repo so they follow upstream on every install.
[[skills]]
name = "building-pydantic-ai-agents"
source = "pydantic/skills"
path = "skills/building-pydantic-ai-agents"

[[skills]]
name = "pydantic"
source = "pydantic/skills"
path = "skills/pydantic"

[[skills]]
name = "logfire-evals"
source = "pydantic/skills"
path = "skills/logfire-evals"
